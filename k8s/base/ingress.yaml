apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: astian-maps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.maps.example.org]
      secretName: astian-api-tls
  rules:
    - host: api.maps.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
